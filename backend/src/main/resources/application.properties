# Server configuration (Render provides PORT environment variable)
server.port=${PORT:8080}

# Database connection configuration (supports DB_URL, MYSQL_URL, or DATABASE_URL)
spring.datasource.url=${DB_URL:${MYSQL_URL:${DATABASE_URL:jdbc:mysql://localhost:3306/hospital_db}}}
spring.datasource.username=${DB_USERNAME:${MYSQL_USER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQL_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool (optimized for cloud databases to prevent connection drops)
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=150000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# JWT Secret & Expiration
# In production on Render, set JWT_SECRET to a strong random 32+ character key.
app.jwt.secret=${JWT_SECRET:medicare_default_jwt_secret_key_change_in_production_32bytes_min}
app.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:120}

# CORS Allowed Origins (comma-separated list of allowed origin URLs or wildcard patterns)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.vercel.app}

# Demo Doctor Account Initialization
app.demo.doctor.email=${DEMO_DOCTOR_EMAIL:samuel.okafor@medicare.local}
app.demo.doctor.password=${DEMO_DOCTOR_PASSWORD:}
app.demo.doctor.name=${DEMO_DOCTOR_NAME:Dr. Samuel Okafor}

